
<!DOCTYPE html>
<html>
<head>
    <title>Bảng mặt hàng</title>
    <style>
        table {
            width: 800px;
            margin: 50px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }
        th {
            height: 50px;
        }
        td {
            height: 40px;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>STT</th>
        <th>Mặt hàng</th>
        <th>Đơn giá</th>
        <th>Số lượng</th>
        <th style="width: 60px;">Thành<br>tiền</th>
        <th style="width: 60px;">Ghi<br>chú</th>
    </tr>

    <tr>
        <td>1</td>
        <td style="text-align: left;">Mặt hàng A</td>
        <td style="text-align: right;">1000</td>
        <td style="text-align: right;">1</td>
        <td style="text-align: right;">1000</td>
        <td></td>
    </tr>

    <tr>
        <td>2</td>
        <td style="text-align: left;">Mặt hàng B</td>
        <td style="text-align: right;">2000</td>
        <td style="text-align: right;">2</td>
        <td style="text-align: right;">4000</td>
        <td></td>
    </tr>
    <tr>
    <tr>
        <td colspan="4">Thành tiền đơn hàng</td>
        <td colspan="2">4000</td>
    </tr>
    </tr>
</table>

</body>
</html>
